name: Official website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false
jobs:
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/check_commits.py --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Check pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/check_commits.py --subject "$PR_TITLE"
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync --frozen
      - run: uv run python scripts/build.py
      - run: uv run python scripts/check.py
      - run: uv run python -m unittest discover -s tests
      - run: node --check src/assets/docs.js
      - run: node --check src/assets/home.js
      - run: node --test tests/*.test.cjs
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify publishing source
        id: pages-source
        env:
          PAGES_TOKEN: ${{ github.token }}
          PAGES_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PYTHON'
          import json, os, urllib.request
          request = urllib.request.Request(
              'https://api.github.com/repos/' + os.environ['PAGES_REPOSITORY'] + '/pages',
              headers={'Authorization': 'Bearer ' + os.environ['PAGES_TOKEN'],
                       'Accept': 'application/vnd.github+json',
                       'X-GitHub-Api-Version': '2022-11-28'})
          with urllib.request.urlopen(request, timeout=20) as response:
              mode = json.load(response).get('build_type', 'unknown')
          if mode not in ('workflow', 'legacy'):
              raise SystemExit('Unexpected Pages publishing source')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('build_type=' + mode + '\n')
          if mode != 'workflow':
              print('::warning::Set Settings > Pages > Source to GitHub Actions to prevent duplicate branch deployments.')
          PYTHON
      - name: "Publishing source: ${{ steps.pages-source.outputs.build_type }}"
        run: echo "Publishing source verified; no credentials were displayed."
      - uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
